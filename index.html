<!doctype html>
<html lang="es">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mariví Gómez — Marketing & Events Portfolio</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    html, body { height: 100%; width: 100%; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #FDFDFD; color: #1A1A1A; }
    .serif-font { font-family: 'Georgia', 'Garamond', serif; }
    .animate-fade-in { animation: fadeIn 1s ease-in forwards; }
    .animate-slide-in { animation: slideIn 1s ease-out forwards; }
    .animate-zoom-in { animation: zoomIn 0.8s ease-out forwards; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideIn { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes zoomIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    .glass-effect { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
    ::selection { background-color: rgba(250, 0, 138, 0.2); }
    .main-wrapper { width: 100%; height: 100%; display: flex; flex-direction: column; overflow-y: auto; }
    .accent-pink { color: #fa008a; }
    .hover-pink:hover { color: #fa008a; }
    .btn-primary { background: black; color: white; transition: all 0.3s; }
    .btn-primary:hover { background: #fa008a; }
    .btn-secondary { background: #fa008a; color: white; transition: all 0.3s; }
    .btn-secondary:hover { background: black; }
    .loader { border: 2px solid #f3f3f3; border-top: 2px solid #fa008a; border-radius: 50%; width: 14px; height: 14px; animation: spin 1s linear infinite; display: inline-block; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .lang-btn { transition: all .2s; }
    .lang-btn.active { color: #fa008a; font-weight: 900; }
    nav.scrolled { box-shadow: 0 1px 0 rgba(0,0,0,0.06), 0 8px 24px -16px rgba(0,0,0,0.15); }
    .lift-card { transition: transform .35s ease, box-shadow .35s ease; }
    .lift-card:hover { transform: translateY(-4px); }
    input:focus-visible, textarea:focus-visible, button:focus-visible {
      outline: 2px solid #fa008a; outline-offset: 2px;
    }
  </style>
 </head>
 <body>
  <div class="main-wrapper">
   <!-- Navigation -->
   <nav id="main-nav" class="fixed top-0 w-full z-50 glass-effect border-b border-neutral-100 px-6 md:px-12 py-5 flex justify-between items-center transition-shadow duration-300">
    <div class="flex items-center gap-2">
     <div class="w-8 h-8 bg-black flex items-center justify-center text-white serif-font text-lg italic font-bold">M</div>
     <span class="serif-font text-xl font-bold tracking-tighter text-black">Mariví Gómez</span>
    </div>
    <div class="hidden md:flex gap-10 text-[10px] font-bold uppercase tracking-[0.2em] text-neutral-500 items-center">
        <a href="#about" class="hover-pink transition-colors" data-i18n="nav.profile"></a>
        <a href="#education" class="hover-pink transition-colors" data-i18n="nav.education"></a>
        <a href="#experience" class="hover-pink transition-colors" data-i18n="nav.experience"></a>
        <a href="#skills" class="hover-pink transition-colors" data-i18n="nav.skills"></a>
        <a href="#ai-lab" class="hover-pink transition-colors flex items-center gap-1"><i data-lucide="zap" style="width:12px;height:12px" class="accent-pink"></i><span data-i18n="nav.ailab"></span></a>
        <span class="flex gap-2 pl-4 border-l border-neutral-200">
          <button class="lang-btn" data-lang="es" onclick="setLang('es')">ES</button>
          <button class="lang-btn" data-lang="en" onclick="setLang('en')">EN</button>
        </span>
    </div>
    <div class="md:hidden flex gap-3 text-[10px] font-bold">
      <button class="lang-btn" data-lang="es" onclick="setLang('es')">ES</button>
      <button class="lang-btn" data-lang="en" onclick="setLang('en')">EN</button>
    </div>
   </nav>

   <!-- Header -->
   <header id="about" class="pt-40 pb-24 px-6 md:px-12 lg:px-24 grid grid-cols-1 lg:grid-cols-2 gap-16 items-start animate-fade-in">
    <div class="space-y-8">
     <div class="flex items-center gap-3">
         <span class="h-[1px] w-12 accent-pink"></span>
         <span class="text-xs font-bold uppercase tracking-widest accent-pink" data-i18n="header.subtitle"></span>
         <span class="h-[1px] w-12 accent-pink"></span>
     </div>
     <h1 class="text-6xl md:text-[84px] serif-font leading-[0.95] tracking-tighter text-black" data-i18n-html="header.title"></h1>
     <p class="text-xl text-neutral-500 font-light max-w-lg leading-relaxed" data-i18n="header.desc"></p>
     <div class="flex flex-wrap gap-5 pt-4">
         <button onclick="openChat()" class="btn-primary px-10 py-5 flex items-center gap-3 rounded-full group">
           <span data-i18n="header.cta"></span> ✨ <i data-lucide="arrow-right" style="width:20px;height:20px" class="group-hover:translate-x-1 transition-transform"></i>
         </button>
      <div class="flex items-center gap-6 px-4 border-l border-neutral-200">
          <a href="https://www.linkedin.com/in/marivi-gomez-marketingspecialist/" target="_blank" rel="noopener noreferrer" class="flex items-center justify-center hover-pink cursor-pointer transition-colors"><i data-lucide="linkedin" style="width:20px;height:20px"></i></a>
          <a href="mailto:marivigomez01@gmail.com" class="flex items-center justify-center hover-pink cursor-pointer transition-colors"><i data-lucide="mail" style="width:20px;height:20px"></i></a>
          <span class="text-xs font-bold uppercase tracking-widest text-neutral-400" data-i18n="header.location"></span>
      </div>
     </div>
    </div>

    <!-- Profile Card -->
    <div class="relative group animate-zoom-in">
     <div class="absolute -top-10 -right-10 w-40 h-40 rounded-full blur-3xl opacity-50 accent-pink pointer-events-none"></div>
     <div class="relative bg-black aspect-[3/4] overflow-hidden border border-neutral-100 shadow-2xl flex flex-col justify-between p-4 w-full max-w-md">
      <img src="images/marivi-photo.jpg" alt="Mariví Gómez" loading="lazy"
           class="absolute inset-0 w-full h-full object-cover object-top transition-transform duration-700 ease-out group-hover:scale-[1.04]">
      <div class="absolute inset-0 pointer-events-none" style="background:linear-gradient(to bottom, rgba(0,0,0,.55) 0%, rgba(0,0,0,0) 28%, rgba(0,0,0,0) 55%, rgba(0,0,0,.82) 100%);"></div>

      <div class="flex justify-between items-start relative z-10">
       <span></span>
       <div class="text-[9px] font-bold text-white/70 uppercase tracking-[0.3em] pt-2" data-i18n="header.card_tag"></div>
      </div>
      <div class="space-y-3 relative z-10">
       <div class="h-px w-full bg-white/15"></div>
       <div class="flex justify-between items-end">
        <div>
         <p class="text-[9px] font-bold uppercase tracking-[0.4em] mb-2 accent-pink" data-i18n="header.card_index"></p>
         <p class="text-2xl serif-font text-white leading-none" data-i18n="header.card_edition"></p>
        </div>
        <div class="text-white/40 group-hover:text-accent-pink transition-colors duration-500"><i data-lucide="zap" style="width:28px;height:28px"></i></div>
       </div>
       <div class="grid grid-cols-3 gap-2 pt-2 opacity-60">
        <div class="h-1 bg-white/20"></div><div class="h-1 accent-pink"></div><div class="h-1 bg-white/20"></div>
       </div>
      </div>
      <div class="flex justify-between items-center text-white/60 text-[9px] font-bold uppercase tracking-widest relative z-10">
          <span>MARIVI G.</span>
          <span class="flex gap-2 items-center"><div class="w-1 h-1 rounded-full accent-pink"></div><span data-i18n="header.card_role"></span></span>
      </div>
     </div>
    </div>
   </header>

   <!-- Education -->
   <section id="education" class="py-24 px-6 md:px-24 max-w-7xl mx-auto border-t border-neutral-100 w-full">
    <div class="flex items-center gap-4 mb-16"><i data-lucide="graduation-cap" style="width:32px;height:32px" class="accent-pink"></i>
     <h2 class="text-4xl serif-font italic" data-i18n="education.title"></h2>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8" id="education-container"></div>
   </section>

   <!-- Skills -->
   <section id="skills" class="bg-[#0A0A0A] text-white py-32 px-6 md:px-24 w-full">
    <div class="max-w-7xl mx-auto">
     <div class="grid grid-cols-1 lg:grid-cols-2 gap-20 mb-20">
      <h2 class="text-5xl serif-font leading-tight" data-i18n-html="skills.title"></h2>
      <p class="text-neutral-400 text-lg font-light leading-relaxed flex items-end" data-i18n="skills.desc"></p>
     </div>
     <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-px bg-neutral-800 border border-neutral-800" id="skills-container"></div>
    </div>
   </section>

   <!-- Experience -->
   <section id="experience" class="py-32 px-6 md:px-24 max-w-7xl mx-auto w-full">
    <div class="flex flex-col md:flex-row justify-between items-baseline mb-24 gap-8">
     <h2 class="text-5xl serif-font italic" data-i18n="experience.title"></h2>
     <div class="flex gap-4 border-b border-neutral-100 pb-2" id="filter-buttons"></div>
    </div>
    <div class="space-y-32" id="experience-container"></div>
   </section>

   <!-- AI Lab -->
   <section id="ai-lab" class="bg-[#F8F8F8] py-32 px-6 md:px-24 border-y border-neutral-100 w-full">
    <div class="max-w-6xl mx-auto">
     <div class="text-center mb-20 space-y-4">
      <div class="inline-block bg-white p-4 rounded-3xl shadow-sm mb-6"><i data-lucide="brain-circuit" style="width:40px;height:40px" class="accent-pink"></i></div>
      <h2 class="text-5xl serif-font italic" data-i18n="ailab.title"></h2>
      <p class="text-neutral-500 max-w-xl mx-auto" data-i18n="ailab.desc"></p>
     </div>
     <div class="grid grid-cols-1 lg:grid-cols-2 gap-12">

      <!-- Match Simulator -->
      <div class="lift-card bg-white p-10 rounded-3xl shadow-xl shadow-neutral-200/50 flex flex-col">
       <div class="flex items-center gap-3 mb-8"><i data-lucide="target" style="width:24px;height:24px" class="accent-pink"></i>
        <h3 class="text-xl font-bold uppercase tracking-tighter" data-i18n="ailab.simulator_title"></h3>
       </div>
       <textarea id="job-description" class="flex-1 min-h-[150px] p-6 bg-neutral-50 border-none rounded-2xl outline-none text-sm font-light mb-6 resize-none" data-i18n-placeholder="ailab.simulator_placeholder"></textarea>
       <button onclick="analyzeMatch()" class="w-full py-4 btn-primary rounded-xl font-bold uppercase tracking-widest text-[10px] flex justify-center items-center gap-2" id="analyze-btn"><span data-i18n="ailab.simulator_btn"></span></button>
       <div id="match-score-container" class="hidden mt-8 pt-8 border-t border-neutral-100 animate-zoom-in">
        <div class="flex items-center gap-6">
         <div class="text-4xl serif-font accent-pink font-bold" id="score-value">0%</div>
         <ul class="text-xs text-neutral-500 space-y-1" id="score-reasons"></ul>
        </div>
       </div>
      </div>

      <!-- Event Strategist -->
      <div class="lift-card bg-white p-10 rounded-3xl shadow-xl shadow-neutral-200/50 flex flex-col">
       <div class="flex items-center gap-3 mb-8"><i data-lucide="lightbulb" style="width:24px;height:24px" class="accent-pink"></i>
        <h3 class="text-xl font-bold uppercase tracking-tighter" data-i18n="ailab.event_title"></h3>
       </div>
       <input type="text" id="event-goal" class="p-6 bg-neutral-50 border-none rounded-2xl outline-none text-sm font-light mb-6" data-i18n-placeholder="ailab.event_placeholder">
       <button onclick="generateEventStrategy()" class="w-full py-4 btn-secondary rounded-xl font-bold uppercase tracking-widest text-[10px] flex justify-center items-center gap-2 shadow-lg shadow-[#fa008a]/30" id="event-btn"><span data-i18n="ailab.event_btn"></span></button>
       <div id="event-proposal-container" class="hidden mt-8 pt-8 border-t border-neutral-100 animate-slide-in">
        <h4 class="font-bold text-sm mb-2 uppercase" id="event-title"></h4>
        <p class="text-xs text-neutral-500 leading-relaxed mb-4" id="event-concept"></p>
        <div class="flex flex-wrap gap-2" id="event-kpis"></div>
       </div>
      </div>
     </div>
    </div>
   </section>

   <!-- Footer -->
   <footer class="py-24 px-6 text-center w-full">
    <div class="max-w-xs mx-auto space-y-8">
     <p class="serif-font text-4xl italic font-bold">MG.</p>
     <div class="flex justify-center gap-8 text-neutral-300">
         <a href="https://www.linkedin.com/in/marivi-gomez-marketingspecialist/" target="_blank" rel="noopener noreferrer" style="display:flex;align-items:center;justify-content:center"><i data-lucide="linkedin" style="width:24px;height:24px" class="hover-pink transition-colors cursor-pointer"></i></a>
         <i data-lucide="globe" style="width:24px;height:24px" class="hover-pink transition-colors cursor-pointer"></i>
         <a href="mailto:marivigomez01@gmail.com" style="display:flex;align-items:center;justify-content:center"><i data-lucide="mail" style="width:24px;height:24px" class="hover-pink transition-colors cursor-pointer"></i></a>
     </div>
     <p class="text-[10px] text-neutral-400 uppercase tracking-[0.4em] font-bold" data-i18n="footer.copy"></p>
    </div>
   </footer>

   <!-- Chat Drawer -->
   <div id="chat-drawer" class="fixed inset-y-0 right-0 w-full md:w-[480px] bg-white shadow-[-30px_0_80px_-20px_rgba(0,0,0,0.1)] z-[100] hidden flex-col animate-slide-in">
    <div class="p-8 bg-black text-white flex justify-between items-center">
     <div>
      <div class="flex items-center gap-2 mb-1"><i data-lucide="sparkles" style="width:16px;height:16px" class="accent-pink"></i> <span class="text-[10px] font-bold uppercase tracking-widest accent-pink" data-i18n="chat.badge"></span></div>
      <h3 class="text-2xl serif-font italic">Marivi Insights</h3>
     </div>
     <button onclick="closeChat()" class="p-2 hover:bg-neutral-800 rounded-full transition-colors"><i data-lucide="x" style="width:28px;height:28px"></i></button>
    </div>
    <div id="chat-messages" class="flex-1 overflow-y-auto p-10 space-y-8 bg-[#FAFAFA]"></div>
    <div class="p-8 bg-white border-t border-neutral-50">
     <div class="relative flex items-center">
         <input type="text" id="chat-input" data-i18n-placeholder="chat.input_placeholder" class="w-full p-5 pr-16 bg-neutral-50 border-none rounded-2xl focus:ring-2 focus:ring-[#fa008a]/10 outline-none text-sm font-light">
         <button onclick="sendMessage()" class="absolute right-2 p-4 btn-primary rounded-xl hover:shadow-lg transition-all" id="send-btn"><i data-lucide="send" style="width:18px;height:18px"></i></button>
     </div>
    </div>
   </div>

   <!-- Floating Chat Button -->
   <button onclick="openChat()" id="floating-btn" class="fixed bottom-12 right-12 bg-black text-white p-6 rounded-full shadow-2xl hover:scale-110 active:scale-95 transition-all z-40 group border-4 border-white"><i data-lucide="sparkles" style="width:32px;height:32px" class="group-hover:accent-pink transition-colors"></i></button>
  </div>

  <script src="config.js"></script>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
 </body>
</html>
